      - name: premiumScheduleId
        in: path
        description: Unique identifier of the PremiumSchedule
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Unique key for idempotent requests. If provided, ensures that\
          \ identical requests with the same key will only be processed once."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: PremiumSchedule found
          content:
            '*/*':
