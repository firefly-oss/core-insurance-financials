openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:18080
  description: Generated server url
tags:
- name: Premium Audits
  description: "Premium audit adjustment from declared exposure. The rating figure\
    \ is recorded, not calculated here."
- name: Commission Entries
  description: Commission accrued for a party or distributor against a premium schedule
- name: Premium Refunds
  description: Refund recorded against a premium schedule
- name: Indemnity Disbursements
  description: "Indemnity record pointing at a claim settlement and, once paid, a\
    \ payment order"
- name: Premium Instalments
  description: One instalment on a premium schedule
- name: Bordereau Lines
  description: "One premium, commission, claim, or refund line on a bordereau"
- name: Credit Control
  description: Arrears follow-up and lapse notice against a premium schedule
- name: Premium Schedules
  description: Premium schedule for a policy
- name: Bordereaux
  description: Bordereau for a distributor and a period
paths:
