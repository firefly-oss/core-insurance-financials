components:
  schemas:
    PremiumScheduleDTO:
      required:
      - policyId
      - scheduleStatus
      - tenantId
      type: object
      properties:
        premiumScheduleId:
          type: string
          format: uuid
          readOnly: true
        tenantId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        currency:
          pattern: "[A-Z]{3}"
          type: string
        scheduleStatus:
          type: string
          enum:
          - ACTIVE
          - COMPLETED
          - CANCELLED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PremiumRefundDTO:
      required:
      - amount
      - policyId
      - premiumScheduleId
      - refundStatus
      type: object
      properties:
        premiumRefundId:
          type: string
          format: uuid
          readOnly: true
        premiumScheduleId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        amount:
          type: number
        currency:
          pattern: "[A-Z]{3}"
          type: string
        reason:
          maxLength: 4000
          minLength: 0
          type: string
        refundStatus:
          type: string
          enum:
          - REQUESTED
          - APPROVED
          - PAID
          - REJECTED
        paymentOrderId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PremiumInstalmentDTO:
      required:
      - amount
      - dueDate
      - instalmentStatus
      - premiumScheduleId
      - sequenceNumber
      type: object
      properties:
        premiumInstalmentId:
          type: string
          format: uuid
          readOnly: true
        premiumScheduleId:
          type: string
          format: uuid
        sequenceNumber:
          type: integer
          format: int32
        dueDate:
          type: string
          format: date
        amount:
          type: number
        instalmentStatus:
          type: string
          enum:
          - SCHEDULED
          - DUE
          - COLLECTED
          - OVERDUE
          - WAIVED
          - REFUNDED
        paymentOrderId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreditControlCaseDTO:
      required:
      - arrearsAmount
      - caseStatus
      - openedAt
      - premiumScheduleId
      type: object
      properties:
        creditControlCaseId:
          type: string
          format: uuid
          readOnly: true
        premiumScheduleId:
          type: string
          format: uuid
        caseStatus:
          type: string
          enum:
          - OPEN
          - REMINDED
          - LAPSE_NOTICE
          - LAPSED
          - CURED
        arrearsAmount:
          type: number
        currency:
          pattern: "[A-Z]{3}"
          type: string
        openedAt:
          type: string
          format: date-time
        lapseNoticeAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CommissionEntryDTO:
      required:
      - amount
      - commissionStatus
      - commissionType
      - partyId
      - premiumScheduleId
      type: object
      properties:
        commissionEntryId:
          type: string
          format: uuid
          readOnly: true
        premiumScheduleId:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        distributorId:
          type: string
          format: uuid
        commissionType:
          type: string
          enum:
          - ACQUISITION
          - RENEWAL
          - OVERRIDE
        amount:
          type: number
        currency:
          pattern: "[A-Z]{3}"
          type: string
        commissionStatus:
          type: string
          enum:
          - ACCRUED
          - PAYABLE
          - PAID
          - CLAWED_BACK
        paymentOrderId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PremiumAuditDTO:
      required:
      - adjustmentAmount
      - auditStatus
      - policyId
      - premiumScheduleId
      type: object
      properties:
        premiumAuditId:
          type: string
          format: uuid
          readOnly: true
        premiumScheduleId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        declaredExposure:
          type: number
        auditedExposure:
          type: number
        adjustmentAmount:
          type: number
        currency:
          pattern: "[A-Z]{3}"
          type: string
        auditStatus:
          type: string
          enum:
          - DRAFT
          - PROPOSED
          - APPROVED
          - REJECTED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IndemnityDisbursementDTO:
      required:
      - amount
      - claimId
      - claimSettlementId
      - disbursementStatus
      - payeePartyId
      - tenantId
      type: object
      properties:
        indemnityDisbursementId:
          type: string
          format: uuid
          readOnly: true
        tenantId:
          type: string
          format: uuid
        claimId:
          type: string
          format: uuid
        claimSettlementId:
          type: string
          format: uuid
        payeePartyId:
          type: string
          format: uuid
        amount:
          type: number
        currency:
          pattern: "[A-Z]{3}"
          type: string
        disbursementStatus:
          type: string
          enum:
          - RECORDED
          - SUBMITTED
          - SETTLED
          - FAILED
        paymentOrderId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BordereauDTO:
      required:
      - bordereauStatus
      - distributorId
      - periodEnd
      - periodStart
      - tenantId
      type: object
      properties:
        bordereauId:
          type: string
          format: uuid
          readOnly: true
        tenantId:
          type: string
          format: uuid
        distributorId:
          type: string
          format: uuid
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        bordereauStatus:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - ACCEPTED
          - REJECTED
        currency:
          pattern: "[A-Z]{3}"
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BordereauLineDTO:
      required:
      - amount
      - bordereauId
      - lineType
      type: object
      properties:
        bordereauLineId:
          type: string
          format: uuid
          readOnly: true
